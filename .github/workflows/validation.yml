name: Validation

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m ruff check .
      - run: python -m pytest -q -m 'not native' --junitxml=reports/python.xml
      - run: python scripts/check_test_report.py reports/python.xml
      - run: python -m build
      - name: Install and verify the built wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/avl-mcp" --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-${{ matrix.python }}-evidence
          path: |
            reports/
            dist/
          if-no-files-found: error
          retention-days: 14

  native:
    name: AVL 3.52 native acceptance
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        id: native-deps
        with:
          micromamba-version: '2.9.0-0'
          environment-name: avl-build
          environment-file: docs/native-dependencies-osx-arm64.lock
          init-shell: none
          generate-run-shell: false
      - name: Verify official source and build AVL
        env:
          COMPILER_PREFIX: ${{ steps.native-deps.outputs.environment-path }}
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/avl3.52.tgz" \
            https://web.mit.edu/drela/Public/web/avl/avl3.52.tgz
          python scripts/prepare_native_source.py --archive "$RUNNER_TEMP/avl3.52.tgz" \
            --destination "$RUNNER_TEMP/avl-source"
          python scripts/build_avl_macos.py \
            --source "$RUNNER_TEMP/avl-source/AVL3.52rel09032025" \
            --compiler-prefix "$COMPILER_PREFIX" --logs reports/native-build
          echo "AVL_BIN=$RUNNER_TEMP/avl-source/AVL3.52rel09032025/bin/avl" >> "$GITHUB_ENV"
      - run: python -m pip install '.[test]'
      - name: Full regression with real AVL and no skipped tests
        run: |
          python -m pytest -q --require-native --junitxml=reports/native.xml
          python scripts/check_test_report.py reports/native.xml
      - run: python -m build
      - name: Installed-wheel ten-tool acceptance
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/installed/bin/python" -m pip check
          "$RUNNER_TEMP/installed/bin/python" scripts/verify_stdio.py \
            --command "$RUNNER_TEMP/installed/bin/avl-mcp" \
            --avl-bin "$AVL_BIN" --work-root "$RUNNER_TEMP/stdio-acceptance" \
            --vanilla examples/official/vanilla/vanilla.avl --bd examples/official/bd/bd.avl
          cp "$RUNNER_TEMP/stdio-acceptance/reports/mcp-stdio-validation.json" reports/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-acceptance-evidence
          path: |
            reports/
            dist/
            ${{ runner.temp }}/stdio-acceptance/reports/
            ${{ runner.temp }}/stdio-acceptance/logs/
          if-no-files-found: error
          retention-days: 14

  acceptance:
    name: Release acceptance
    if: always()
    needs: [python, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both validation layers
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$NATIVE_RESULT" = success
