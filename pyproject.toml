[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avl-mcp"
version = "0.1.0a1"
description = "Reproducible AVL aerodynamic analyses through Model Context Protocol"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
dependencies = ["mcp>=1.20,<2", "pydantic>=2.11,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14", "build", "matplotlib>=3.8"]

[project.scripts]
avl-mcp = "avl_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["native: requires an AVL 3.52 executable"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

